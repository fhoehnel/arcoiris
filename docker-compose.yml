services:
  arcoiris-blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: arcoiris-blog:java17-tomcat10
    container_name: arcoiris-blog
    restart: unless-stopped
    ports:
      - "9753:8080"
    volumes:
      # Persist mutable WEB-INF config files on the host.
      - ./docker/config/blog.conf:/usr/local/tomcat/webapps/arcoiris-blog/WEB-INF/blog.conf
      - ./docker/config/users.xml:/usr/local/tomcat/webapps/arcoiris-blog/WEB-INF/userhome/users.xml
      - ./docker/config/invitations.xml:/usr/local/tomcat/webapps/arcoiris-blog/WEB-INF/userhome/invitations.xml
      # Persists self-registered user home folders (default UserDocumentRoot).
      # - user_home:/usr/local/tomcat/webapps/arcoiris-blog/WEB-INF/userhome

      # - type: bind
      #   source: C:/projekte/arcoiris/docker-user-home
      #   target: /usr/local/tomcat/webapps/arcoiris-blog/WEB-INF/userhome

volumes:
  arcoiris_blog_bookmarks:
  arcoiris_blog_categories:
  arcoiris_blog_fastpath:
  arcoiris_blog_userhome:

