services:
  arcoiris-blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: arcoiris-blog:java17-tomcat10
    container_name: arcoiris-blog
    restart: unless-stopped
    ports:
      - "9753:8080"
    volumes:
      # Persists user data (user database, invitation database, user blog data)
      # - arcoiris_blog_data:/usr/local/tomcat/webapps/arcoiris-blog/WEB-INF/userhome

volumes:
  arcoiris_blog_bookmarks:
  arcoiris_blog_categories:
  arcoiris_blog_fastpath:
  arcoiris_blog_userhome:

